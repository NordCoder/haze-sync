name: Fan-in Stage 3 Database Ping Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transport:
    name: Publish corrected database runtime blob
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify source and destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git ls-remote --heads origin refs/heads/fan-in/stage3-db-ping-content-v1)"

      - name: Materialize corrected database module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("crates/haze-sync-server/src/db/mod.rs")
          source = source_path.read_text()
          old = 'sqlx::query_scalar::<_, i64>("select 1")'
          new = 'sqlx::query_scalar::<_, i64>("select 1::bigint")'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one ping query, found {count}")
          corrected = source.replace(old, new, 1)
          destination = Path("fan-in-artifacts/stage3/db-mod.rs")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(corrected)
          PY
          grep -F 'query_scalar::<_, i64>("select 1::bigint")' fan-in-artifacts/stage3/db-mod.rs
          git diff --check -- fan-in-artifacts/stage3/db-mod.rs
          test "$(git status --short)" = "?? fan-in-artifacts/"

      - name: Publish byte-preserving content branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "haze-sync fan-in"
          git config user.email "actions@users.noreply.github.com"
          git add fan-in-artifacts/stage3/db-mod.rs
          git commit -m "fix(server): use PostgreSQL bigint readiness probe"
          git push origin HEAD:refs/heads/fan-in/stage3-db-ping-content-v1
