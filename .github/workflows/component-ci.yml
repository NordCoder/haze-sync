name: Component CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'component/') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haze_sync_test
          POSTGRES_PASSWORD: haze_sync_test
          POSTGRES_DB: haze_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haze_sync_test -d haze_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HAZE_WORKFLOW_SLUG: component-ci
      HAZE_SYNC_TEST_DATABASE_URL: postgres://haze_sync_test:haze_sync_test@localhost:5432/haze_sync_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve component context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          component="unknown"

          if [[ "$branch" == component/* ]]; then
            component="${branch#component/}"
          fi

          echo "HAZE_COMPONENT=${component}" >> "$GITHUB_ENV"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: cargo fmt
        shell: bash
        run: bash .github/scripts/ci-run.sh rust-fmt cargo fmt --all --check

      - name: cargo check
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-check cargo check --workspace

      - name: cargo test
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-test cargo test --workspace

      - name: cargo clippy
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-clippy cargo clippy --workspace --all-targets -- -D warnings

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-${{ env.HAZE_COMPONENT }}__wf-${{ env.HAZE_WORKFLOW_SLUG }}__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
