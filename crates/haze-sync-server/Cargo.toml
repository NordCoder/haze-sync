[package]
name = "haze-sync-server"
description = "Haze Sync HTTP server scaffolding and configuration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "haze-sync-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["json", "query", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
haze-sync-api = { path = "../haze-sync-api" }
haze-sync-common = { path = "../haze-sync-common" }
haze-sync-core = { path = "../haze-sync-core" }
haze-sync-storage = { path = "../haze-sync-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "macros"] }
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
haze-sync-storage = { path = "../haze-sync-storage", features = ["test-support"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[lints]
workspace = true
