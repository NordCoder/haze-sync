name: Stage 5 Lockfile Reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stage5-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate canonical workspace lockfile
        shell: bash
        run: cargo generate-lockfile

      - name: Verify generated lockfile
        shell: bash
        run: |
          cargo check --workspace --locked
          cargo test --workspace --exclude haze-sync-server --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify publication scope
        shell: bash
        run: |
          unexpected="$(git status --short | grep -vE '^ M Cargo.lock$|^M  Cargo.lock$|^\?\? Cargo.lock$' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo "Lockfile reconciliation changed files outside Cargo.lock." >&2
            exit 1
          fi

      - name: Publish isolated lockfile candidate
        shell: bash
        env:
          DESTINATION_BRANCH: fan-in/stage5-lockfile
        run: |
          git config user.name "haze-sync-fan-in"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$DESTINATION_BRANCH"
          git add Cargo.lock
          git commit --allow-empty -m "chore(fan-in): reconcile workspace lockfile"
          git push origin "HEAD:refs/heads/$DESTINATION_BRANCH"
