name: Fan-in Stage 4 Rust Reconciliation

on:
  pull_request:
    branches:
      - integration/v1-fan-in
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  reconcile-rust:
    if: ${{ github.head_ref == 'fan-in/stage4-reconcile-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify source blobs and destination
        shell: bash
        run: |
          test "$(git hash-object crates/haze-sync-cli/src/doctor.rs)" = "5e3c8d0b3238e6aa142e752b1273aa977b6dcc95"
          test "$(git hash-object crates/haze-sync-cli/src/doctor_live.rs)" = "1b55130529ac9c47ad321d1458022452c3565088"
          test "$(git hash-object crates/haze-gdrive-adapter/src/durable_state.rs)" = "cc1785ad54c130c565fe96ababf04388f399c09a"
          if git ls-remote --exit-code --heads origin refs/heads/fan-in/stage4-rust-reconciled >/dev/null 2>&1; then
            echo "Temporary Stage 4 reconciliation branch already exists." >&2
            exit 1
          fi

      - name: Apply and validate reconciliations
        shell: bash
        run: |
          python .github/scripts/fan-in-stage4-reconcile.py
          cargo fmt --all
          cargo check --workspace
          cargo test --workspace --exclude haze-sync-server
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Publish isolated reconciled source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c fan-in/stage4-rust-reconciled
          git add \
            crates/haze-sync-cli/src/doctor.rs \
            crates/haze-sync-cli/src/doctor_live.rs \
            crates/haze-gdrive-adapter/src/durable_state.rs
          git commit -m "fix(fan-in): reconcile CLI and GDrive contracts"
          git push origin HEAD:refs/heads/fan-in/stage4-rust-reconciled
