[package]
name = "haze-sync-storage"
description = "Storage schema metadata, local object store primitives, and test support for Haze Sync."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
haze-sync-common = { path = "../haze-sync-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "json"] }

[lints]
workspace = true
