name: Storage Branch Sync Bootstrap

on:
  push:
    branches:
      - component/storage

permissions:
  contents: write

concurrency:
  group: storage-branch-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch-sync:
    name: Merge main into storage branch
    if: ${{ github.ref_name == 'component/storage' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout storage branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create verified two-parent merge
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main component/storage

          first_parent="$(git rev-parse HEAD)"
          second_parent="$(git rev-parse origin/main)"
          canonical_parent="$(git rev-parse HEAD^)"

          if git merge-base --is-ancestor "$second_parent" "$first_parent"; then
            echo "component/storage already contains current main"
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit "$second_parent"
          merge_status=$?
          set -e

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unmerged" && "$unmerged" != ".github/workflows/component-ci.yml" ]]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unmerged" >&2
            exit 1
          fi
          if [[ "$merge_status" -ne 0 && "$unmerged" != ".github/workflows/component-ci.yml" ]]; then
            echo "Merge failed without the expected workflow-only conflict." >&2
            exit 1
          fi

          git show "$canonical_parent:.github/workflows/component-ci.yml" > .github/workflows/component-ci.yml
          git add .github/workflows/component-ci.yml

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          main_exact_paths=(
            ".github/docs/ci-diagnostics-artifacts.md"
            ".github/scripts/ci-finalize.sh"
            ".github/scripts/ci-run.sh"
            ".github/workflows/ci.yml"
            ".github/workflows/obsidian-plugin.yml"
            ".github/workflows/rust.yml"
          )
          for path in "${main_exact_paths[@]}"; do
            git show "$second_parent:$path" | cmp - "$path"
          done

          git diff --exit-code "$first_parent" -- crates/haze-sync-storage migrations/0010_worktree_durable_state.sql

          git commit -m "Merge main into component/storage for STOR-P10 verification"
          merge_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$first_parent"
          test "$(git rev-parse HEAD^2)" = "$second_parent"

          echo "Created merge commit $merge_commit"
          echo "First parent: $first_parent"
          echo "Second parent: $second_parent"
          git push origin HEAD:component/storage
