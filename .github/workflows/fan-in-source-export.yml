name: Fan-in Stage 3 Cursor Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    name: Build cursor reconciliation candidate
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify source head and temporary ref
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git ls-remote --heads origin refs/heads/fan-in/stage3-cursor-patch)"

      - name: Apply private cursor reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          production = Path("crates/haze-sync-server/src/routes/gdrive.rs")
          source = production.read_text()
          source = replace_once(
              source,
              "GDriveCursorSummaryDto, GDriveDeleteCandidateFactsDto",
              "GDriveDeleteCandidateFactsDto, GDrivePrivateCursorStateDto, GDriveRawCursorDto",
              "gdrive import",
          )
          source = replace_once(
              source,
              "    Ok(GDriveStateSnapshotResponse {",
              "    let cursor_generation = to_u64(page.state.drive_cursor_generation)?;\n"
              "    let cursor = match page.state.drive_cursor.as_deref() {\n"
              "        Some(cursor) => GDrivePrivateCursorStateDto::Present {\n"
              "            generation: cursor_generation,\n"
              "            cursor: GDriveRawCursorDto::parse(cursor)\n"
              "                .map_err(|_| GDriveHttpError::internal())?,\n"
              "        },\n"
              "        None => GDrivePrivateCursorStateDto::Absent {\n"
              "            generation: cursor_generation,\n"
              "        },\n"
              "    };\n"
              "    Ok(GDriveStateSnapshotResponse {",
              "snapshot constructor",
          )
          source = replace_once(
              source,
              "cursor: GDriveCursorSummaryDto {\n"
              "            generation: to_u64(page.state.drive_cursor_generation)?,\n"
              "            present: page.state.drive_cursor.is_some(),\n"
              "        },",
              "cursor,",
              "cursor summary mapping",
          )
          production.write_text(source)

          tests = Path("crates/haze-sync-server/src/routes/gdrive_tests.rs")
          source = tests.read_text()
          source = replace_once(
              source,
              'assert_eq!(private["cursor"]["generation"], 1);\n'
              '    assert_eq!(private["cursor"]["present"], true);',
              'assert_eq!(private["cursor"]["state"], "present");\n'
              '    assert_eq!(private["cursor"]["generation"], 1);\n'
              '    assert_eq!(private["cursor"]["cursor"], "private-raw-cursor");',
              "private cursor assertions",
          )
          source = replace_once(
              source,
              '    assert!(!private.to_string().contains("private-raw-cursor"));\n\n',
              "",
              "private cursor visibility assertion",
          )
          source = replace_once(
              source,
              '    assert_eq!(admin["mapping_count"], 1);',
              '    assert_eq!(admin["cursor"]["generation"], 1);\n'
              '    assert_eq!(admin["cursor"]["present"], true);\n'
              '    assert!(admin["cursor"].get("cursor").is_none());\n'
              '    assert_eq!(admin["mapping_count"], 1);',
              "admin cursor assertions",
          )
          source = replace_once(
              source,
              '    assert_eq!(isolated_state["mappings"], json!([]));',
              '    assert_eq!(isolated_state["cursor"]["state"], "absent");\n'
              '    assert_eq!(isolated_state["cursor"]["generation"], 0);\n'
              '    assert!(isolated_state["cursor"].get("cursor").is_none());\n'
              '    assert_eq!(isolated_state["mappings"], json!([]));',
              "absent cursor assertions",
          )
          tests.write_text(source)
          PY

      - name: Format and verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            crates/haze-sync-server/src/routes/gdrive.rs \
            crates/haze-sync-server/src/routes/gdrive_tests.rs
          git diff --check
          expected=$'crates/haze-sync-server/src/routes/gdrive.rs\ncrates/haze-sync-server/src/routes/gdrive_tests.rs'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          ! grep -F 'GDriveCursorSummaryDto' crates/haze-sync-server/src/routes/gdrive.rs
          grep -F 'GDrivePrivateCursorStateDto::Present' crates/haze-sync-server/src/routes/gdrive.rs
          grep -F 'GDrivePrivateCursorStateDto::Absent' crates/haze-sync-server/src/routes/gdrive.rs

      - name: Create isolated candidate ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "haze-sync fan-in"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/haze-sync-server/src/routes/gdrive.rs \
            crates/haze-sync-server/src/routes/gdrive_tests.rs
          git commit -m "fix(server): align private GDrive cursor contract"
          git push origin HEAD:refs/heads/fan-in/stage3-cursor-patch
