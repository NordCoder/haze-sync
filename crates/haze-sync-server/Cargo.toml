[package]
name = "haze-sync-server"
description = "Haze Sync HTTP route shell and configuration foundation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "haze-sync-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["json", "query", "tokio", "http1"] }
haze-sync-api = { path = "../haze-sync-api" }
haze-sync-common = { path = "../haze-sync-common" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }

[lints]
workspace = true
