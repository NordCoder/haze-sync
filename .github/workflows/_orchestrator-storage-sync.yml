name: Orchestrator Storage Branch Sync

on:
  push:
    branches:
      - component/storage
    paths:
      - .github/workflows/_orchestrator-storage-sync.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout component branch
        uses: actions/checkout@v4
        with:
          ref: component/storage
          fetch-depth: 0

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          sync_workflow='.github/workflows/_orchestrator-storage-sync.yml'
          expected_main='c1e69a664388b0cba028170e8398b9088218957d'
          old_head="$(git rev-parse HEAD)"

          git config user.name 'haze-sync-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --no-tags origin main component/storage

          actual_main="$(git rev-parse origin/main)"
          actual_component="$(git rev-parse origin/component/storage)"
          test "$actual_main" = "$expected_main"
          test "$actual_component" = "$old_head"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ "$merge_status" -ne 0 ]; then
            test "$unresolved" = '.github/workflows/component-ci.yml'
            git checkout --ours .github/workflows/component-ci.yml
            git add .github/workflows/component-ci.yml
          else
            test -z "$unresolved"
          fi

          rm -f "$sync_workflow"
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          for path in \
            .github/docs/ci-diagnostics-artifacts.md \
            .github/scripts/ci-finalize.sh \
            .github/scripts/ci-run.sh \
            .github/workflows/ci.yml \
            .github/workflows/obsidian-plugin.yml \
            .github/workflows/rust.yml; do
            git diff --quiet origin/main -- "$path"
          done

          grep -F 'contents: read' .github/workflows/component-ci.yml
          grep -F 'storage-postgres:' .github/workflows/component-ci.yml
          grep -F 'cargo test -p haze-sync-storage --features test-support -- --ignored' .github/workflows/component-ci.yml
          test ! -e "$sync_workflow"

          git commit -m 'Merge main into component/storage for PostgreSQL verification'
          merge_head="$(git rev-parse HEAD)"
          parents="$(git show -s --format='%P' HEAD)"
          test "$parents" = "$old_head $actual_main"
          test "$(git rev-list --count --parents -n 1 HEAD | awk '{print NF-1}')" -eq 2

          git push origin HEAD:component/storage
          echo "merge_head=$merge_head" >> "$GITHUB_STEP_SUMMARY"
          echo "parents=$parents" >> "$GITHUB_STEP_SUMMARY"
