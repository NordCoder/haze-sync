[package]
name = "haze-gdrive-adapter"
description = "Long-running Haze Google Drive replica adapter runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "haze-gdrive-adapter"
path = "src/main.rs"

[dependencies]
haze-sync-api = { path = "../haze-sync-api" }
haze-sync-common = { path = "../haze-sync-common" }
ctrlc = { version = "3.4", features = ["termination"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[lints]
workspace = true
