# Local development compose scaffold.
#
# This file starts local dependencies and the local haze-sync-server process for
# developer/operator smoke workflows. It is not production deployment: no GDrive
# adapter, Worktree runtime, reverse proxy, TLS, provider credentials, production
# secrets, migration runner, backup jobs, or remote deployment automation are
# configured here.

services:
  postgres:
    image: postgres:16
    environment:
      # Local placeholders. Override through an untracked .env file when needed.
      POSTGRES_DB: ${POSTGRES_DB:-haze_sync}
      POSTGRES_USER: ${POSTGRES_USER:-haze_sync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haze_sync_local_placeholder}
    ports:
      # Local-only bind. Do not widen this bind address in this scaffold.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      # The server listens on all interfaces inside the container so Docker can
      # publish it. The host bind below remains 127.0.0.1 only.
      HAZE_SYNC_LISTEN_ADDR: 0.0.0.0:8080
      # Local placeholder URL for the Compose network only. Use an untracked .env
      # file for local overrides; do not commit production database URLs.
      HAZE_SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-haze_sync}:${POSTGRES_PASSWORD:-haze_sync_local_placeholder}@postgres:5432/${POSTGRES_DB:-haze_sync}
      HAZE_SYNC_OBJECT_STORE_PATH: /var/lib/haze-sync/objects
      HAZE_SYNC_WORKTREE_PATH: /var/lib/haze-sync/worktree
      HAZE_SYNC_WORKTREE_ADAPTER_MODE: disabled
      HAZE_GDRIVE_ADAPTER_MODE: disabled
      HAZE_OBSIDIAN_ADAPTER_MODE: disabled
    ports:
      # Local/proxy-bound HTTP exposure. Public TLS/reverse-proxy wiring is a
      # later deployment phase; do not widen this bind in local compose.
      - "127.0.0.1:${HAZE_SYNC_HTTP_PORT:-8080}:8080"
    volumes:
      - server_objects:/var/lib/haze-sync/objects
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Future phases will add haze-gdrive-adapter service wiring only after its
  # startup/config/secret contracts are stable.
  #
  # Worktree runtime bind mounts remain intentionally deferred; the server service
  # keeps the Worktree adapter mode disabled until Server/Worktree fan-in accepts
  # runtime hosting behavior.

volumes:
  postgres_data:
  server_objects:
