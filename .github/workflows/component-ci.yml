name: Component CI

on:
  push:
    branches: ['component/**', 'process/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics
          echo "run_id=$GITHUB_RUN_ID" > ci-diagnostics/metadata.txt
          echo "sha=$GITHUB_SHA" >> ci-diagnostics/metadata.txt
          cargo fmt --all --check > ci-diagnostics/fmt.log 2>&1; fmt_status=$?
          cargo fmt --all >> ci-diagnostics/fmt.log 2>&1; fmt_apply_status=$?
          git diff -- . > ci-diagnostics/rustfmt.patch || true
          git checkout -- . || true
          cargo check --workspace > ci-diagnostics/check.log 2>&1; check_status=$?
          cargo test --workspace > ci-diagnostics/test.log 2>&1; test_status=$?
          cargo clippy --workspace --all-targets -- -D warnings > ci-diagnostics/clippy.log 2>&1; clippy_status=$?
          echo "fmt_status=$fmt_status" >> ci-diagnostics/metadata.txt
          echo "fmt_apply_status=$fmt_apply_status" >> ci-diagnostics/metadata.txt
          echo "check_status=$check_status" >> ci-diagnostics/metadata.txt
          echo "test_status=$test_status" >> ci-diagnostics/metadata.txt
          echo "clippy_status=$clippy_status" >> ci-diagnostics/metadata.txt
          if [ "$fmt_status" -ne 0 ] || [ "$fmt_apply_status" -ne 0 ] || [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$clippy_status" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-ci-diagnostics
          path: ci-diagnostics/
          retention-days: 3
          if-no-files-found: error
