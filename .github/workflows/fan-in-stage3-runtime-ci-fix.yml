name: Fan-in Stage 3 Runtime CI Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    name: Build runtime smoke harness fix
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify source head and temporary ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git ls-remote --heads origin refs/heads/fan-in/stage3-runtime-ci-fix)"

      - name: Create configured runtime directories in smoke harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integration-ci.yml")
          source = workflow.read_text()
          old = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          new = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            mkdir -p \"$HAZE_SYNC_OBJECT_STORE_PATH\" \"$HAZE_SYNC_WORKTREE_PATH\"\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one runtime directory insertion point, found {count}")
          workflow.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/integration-ci.yml"

      - name: Publish isolated CI fix candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "haze-sync fan-in"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/integration-ci.yml
          git commit -m "ci: create runtime roots before Server readiness smoke"
          git push origin HEAD:refs/heads/fan-in/stage3-runtime-ci-fix
