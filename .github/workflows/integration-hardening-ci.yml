name: Integration Hardening CI

on:
  pull_request:
    branches:
      - main
      - integration/v1-fan-in
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-rust:
    name: Locked Rust workspace
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAZE_COMPONENT: integration-lockfile
      HAZE_WORKFLOW_SLUG: integration-hardening-lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve candidate context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify locked metadata
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-metadata-locked cargo metadata --locked --format-version 1 --no-deps

      - name: Check locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-check-locked cargo check --workspace --locked

      - name: Test locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-test-locked cargo test --workspace --exclude haze-sync-server --locked

      - name: Clippy locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-clippy-locked cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-integration-lockfile__wf-integration-hardening__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
          include-hidden-files: false

  deployment:
    name: Deployment Compose integration
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAZE_COMPONENT: integration-deployment
      HAZE_WORKFLOW_SLUG: integration-hardening-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve candidate context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate and smoke deployment
        shell: bash
        run: bash .github/scripts/ci-run.sh deployment-smoke bash .github/scripts/deployment-smoke.sh

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-integration-deployment__wf-integration-hardening__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
          include-hidden-files: false

  local-vertical-slice:
    name: Worktree + Obsidian + CLI local vertical slice
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAZE_COMPONENT: integration-local-vertical-slice
      HAZE_WORKFLOW_SLUG: integration-hardening-local-vertical-slice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve candidate context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install locked Node dependencies
        shell: bash
        run: npm ci

      - name: Run local vertical slice
        shell: bash
        run: bash .github/scripts/ci-run.sh local-vertical-slice bash .github/scripts/local-vertical-slice.sh

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-integration-local-vertical-slice__wf-integration-hardening__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
          include-hidden-files: false
