name: Fan-in Stage 3 Runtime CI Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Export corrected runtime smoke workflow
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Create configured runtime directories in smoke harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integration-ci.yml")
          source = workflow.read_text()
          old = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          new = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            mkdir -p \"$HAZE_SYNC_OBJECT_STORE_PATH\" \"$HAZE_SYNC_WORKTREE_PATH\"\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one runtime directory insertion point, found {count}")
          workflow.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/integration-ci.yml"

      - name: Upload corrected workflow
        uses: actions/upload-artifact@v4
        with:
          name: fan-in-stage3-runtime-ci-${{ github.event.pull_request.head.sha }}
          path: .github/workflows/integration-ci.yml
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          include-hidden-files: true
