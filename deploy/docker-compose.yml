# Local development compose scaffold only.
#
# This file starts local dependencies for developer workflows. It is not a
# production deployment: no Haze Sync server, adapters, migrations, reverse
# proxy, TLS, provider credentials, or production secrets are configured here.

services:
  postgres:
    image: postgres:16
    environment:
      # Local placeholders. Override through an untracked .env file when needed.
      POSTGRES_DB: ${POSTGRES_DB:-haze_sync}
      POSTGRES_USER: ${POSTGRES_USER:-haze_sync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haze_sync_local_placeholder}
    ports:
      # Local-only bind. Do not widen this bind address in this scaffold.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Future phases will add haze-sync-server and haze-gdrive-adapter service wiring
  # only after their startup/config/secret contracts are stable.
  #
  # Object-store and worktree bind mounts are intentionally deferred; the current
  # compose file owns local PostgreSQL dependency startup only.

volumes:
  postgres_data:
