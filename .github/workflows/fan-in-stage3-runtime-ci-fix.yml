name: Fan-in Stage 3 Runtime CI Blob Transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  transport:
    name: Publish corrected workflow blob source
    if: ${{ startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify source head and destination ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git ls-remote --heads origin refs/heads/fan-in/stage3-runtime-ci-content-v1)"

      - name: Materialize corrected workflow as ordinary content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integration-ci.yml")
          source = workflow.read_text()
          old = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          new = (
              "            export HAZE_OBSIDIAN_ADAPTER_MODE=disabled\n\n"
              "            mkdir -p \"$HAZE_SYNC_OBJECT_STORE_PATH\" \"$HAZE_SYNC_WORKTREE_PATH\"\n\n"
              "            log=\"${RUNNER_TEMP}/haze-server-runtime.log\""
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one runtime directory insertion point, found {count}")
          corrected = source.replace(old, new, 1)
          destination = Path("fan-in-artifacts/stage3/integration-ci.yml")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(corrected)
          PY

          test "$(grep -Fxc '            mkdir -p "$HAZE_SYNC_OBJECT_STORE_PATH" "$HAZE_SYNC_WORKTREE_PATH"' fan-in-artifacts/stage3/integration-ci.yml)" -eq 1
          cmp -s .github/workflows/integration-ci.yml fan-in-artifacts/stage3/integration-ci.yml && exit 1 || true
          git diff --check -- fan-in-artifacts/stage3/integration-ci.yml
          test "$(git status --short)" = "?? fan-in-artifacts/"

      - name: Publish byte-preserving content branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "haze-sync fan-in"
          git config user.email "actions@users.noreply.github.com"
          git add fan-in-artifacts/stage3/integration-ci.yml
          git commit -m "ci(fan-in): stage corrected integration workflow content"
          git push origin HEAD:refs/heads/fan-in/stage3-runtime-ci-content-v1
