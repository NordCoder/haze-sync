# Stage 9 isolated verifier trigger 1
name: Stage 9 CLI Verifier

on:
  push:
    branches:
      - integration/stage9-cli-ops
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage9-cli-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-rust:
    name: CLI Rust gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAZE_COMPONENT: stage9-cli-rust
      HAZE_COMPONENT_BRANCH: integration/stage9-cli-ops
      HAZE_WORKFLOW_SLUG: stage9-cli-verifier-rust
      HAZE_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-fmt cargo fmt --all --check

      - name: Check CLI
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-check-cli cargo check -p haze-sync-cli --locked

      - name: Test CLI
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-test-cli cargo test -p haze-sync-cli --locked

      - name: Clippy CLI
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-clippy-cli cargo clippy -p haze-sync-cli --all-targets --locked -- -D warnings

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__stage9-cli-rust__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore

  cli-live:
    name: CLI live topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAZE_COMPONENT: stage9-cli-live
      HAZE_COMPONENT_BRANCH: integration/stage9-cli-ops
      HAZE_WORKFLOW_SLUG: stage9-cli-verifier-live
      HAZE_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked Node dependencies
        shell: bash
        run: npm ci

      - name: Run aggregate local topology
        shell: bash
        run: bash .github/scripts/ci-run.sh stage9-cli-live bash .github/scripts/local-vertical-slice.sh

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__stage9-cli-live__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
