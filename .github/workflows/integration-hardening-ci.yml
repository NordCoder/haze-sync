name: Integration Hardening CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-rust:
    name: Locked Rust workspace
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAZE_COMPONENT: integration-lockfile
      HAZE_WORKFLOW_SLUG: integration-hardening-lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve candidate context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Verify locked metadata
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-metadata-locked cargo metadata --locked --format-version 1 --no-deps

      - name: Check locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-check-locked cargo check --workspace --locked

      - name: Test locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-test-locked cargo test --workspace --exclude haze-sync-server --locked

      - name: Clippy locked workspace
        shell: bash
        run: bash .github/scripts/ci-run.sh cargo-clippy-locked cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-integration-lockfile__wf-integration-hardening__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
          include-hidden-files: false

  deployment:
    name: Deployment Compose integration
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAZE_COMPONENT: integration-deployment
      HAZE_WORKFLOW_SLUG: integration-hardening-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve candidate context
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "HAZE_COMPONENT_BRANCH=${branch}" >> "$GITHUB_ENV"
          echo "HAZE_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Validate and smoke deployment
        shell: bash
        run: bash .github/scripts/ci-run.sh deployment-smoke bash .github/scripts/deployment-smoke.sh

      - name: Finalize CI diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/ci-finalize.sh

      - name: Upload CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag__component-integration-deployment__wf-integration-hardening__run-${{ github.run_id }}__attempt-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
          include-hidden-files: false

  stage7-source-export:
    name: Stage 7 source export
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Create source archive
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.test-dist \
            -czf "${RUNNER_TEMP}/haze-sync-stage7-source.tgz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: stage7-source__head-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/haze-sync-stage7-source.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  stage7-candidate-verify:
    name: Stage 7 GDrive candidate verification
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fan-in/stage7-gdrive-runtime-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and reconcile lockfile
        shell: bash
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Verify locked workspace
        shell: bash
        run: |
          cargo check --workspace --locked
          cargo test --workspace --exclude haze-sync-server --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify GDrive runtime package
        shell: bash
        run: |
          cargo test -p haze-gdrive-adapter --locked
          cargo clippy -p haze-gdrive-adapter --all-targets --locked -- -D warnings

      - name: Package verified Stage 7 files
        shell: bash
        run: |
          tar -czf "${RUNNER_TEMP}/stage7-verified-files.tgz" \
            Cargo.lock \
            .env.example \
            .github/scripts/deployment-smoke.sh \
            crates/haze-gdrive-adapter/Cargo.toml \
            crates/haze-gdrive-adapter/src/lib.rs \
            crates/haze-gdrive-adapter/src/main.rs \
            crates/haze-gdrive-adapter/src/runtime.rs \
            deploy/gdrive.Dockerfile \
            deploy/gdrive.Dockerfile.dockerignore \
            deploy/docker-compose.gdrive.yml

      - name: Upload verified Stage 7 files
        uses: actions/upload-artifact@v4
        with:
          name: stage7-verified__head-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/stage7-verified-files.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
